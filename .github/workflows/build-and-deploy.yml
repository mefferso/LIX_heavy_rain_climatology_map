name: Probe NOAA NODD nClimGrid layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public NOAA nClimGrid bucket
        shell: bash
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, xml.etree.ElementTree as ET

          BASE = "https://noaa-nclimgrid-daily-pds.s3.amazonaws.com/"
          NS = {"s3": "http://s3.amazonaws.com/doc/2006-03-01/"}

          def listing(prefix="", delimiter="/"):
              q = {"list-type": "2", "max-keys": "1000"}
              if prefix:
                  q["prefix"] = prefix
              if delimiter:
                  q["delimiter"] = delimiter
              url = BASE + "?" + urllib.parse.urlencode(q)
              print("GET", url)
              with urllib.request.urlopen(url, timeout=60) as r:
                  body = r.read()
                  print("status", r.status, "bytes", len(body))
              root = ET.fromstring(body)
              prefixes = [e.text for e in root.findall("s3:CommonPrefixes/s3:Prefix", NS)]
              keys = [e.text for e in root.findall("s3:Contents/s3:Key", NS)]
              return prefixes, keys

          prefixes, keys = listing()
          print("ROOT PREFIXES:", prefixes)
          print("ROOT KEYS (first 100):", keys[:100])

          frontier = [(p, 1) for p in prefixes if not p.startswith("EpiNOAA/")]
          seen = set()
          target = ("ncdd-195101-grd-scaled.nc", "ncdd-195101-grd-prelim.nc")
          while frontier:
              prefix, depth = frontier.pop(0)
              if prefix in seen or depth > 5:
                  continue
              seen.add(prefix)
              try:
                  ps, ks = listing(prefix)
              except Exception as e:
                  print("LIST ERROR", prefix, repr(e))
                  continue
              print("PREFIX", prefix, "SUBDIRS", ps[:30], "KEYS", ks[:30])
              for k in ks:
                  if k.endswith(target):
                      print("FOUND_TARGET", k)
                      raise SystemExit(0)
              for p in ps:
                  low = p.lower()
                  if depth <= 2 or "1951" in low or "grid" in low or "v1" in low or "data" in low:
                      frontier.append((p, depth + 1))

          print("TARGET NOT FOUND")
          raise SystemExit(2)
          PY
