name: Build climatology and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 10 1 *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Force a complete rebuild from 1951'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt

      - name: Build NOAA heavy-rain climatology
        shell: bash
        run: |
          EXTRA=""
          if [[ "${{ github.event.inputs.rebuild }}" == "true" ]]; then
            EXTRA="--rebuild"
          fi
          python scripts/build_climatology.py $EXTRA --workers 8

      - name: Commit generated climatology
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/climatology_state.npz
          if ! git diff --cached --quiet; then
            git commit -m "Update NOAA heavy-rain climatology"
            git push
          else
            echo "No generated-data changes to commit."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
