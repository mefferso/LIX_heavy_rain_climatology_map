name: Build climatology and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/build-and-deploy.yml'
  schedule:
    # Run after the prior year's final nClimGrid products have had time to settle.
    - cron: '17 9 15 3 *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Rebuild the complete 1951-present climatology from scratch'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lix-heavy-rain-climatology
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt

      - name: Build NOAA heavy-rain climatology
        id: climatology
        continue-on-error: true
        shell: bash
        run: |
          EXTRA=''
          if [[ '${{ inputs.rebuild }}' == 'true' ]]; then
            EXTRA='--rebuild'
          fi
          python scripts/build_climatology.py $EXTRA --workers 12

      - name: Commit generated state and climatology
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/climatology_state.npz docs/data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Update heavy-rain climatology data'
            git push origin HEAD:main
          fi

      - name: Stop if climatology build failed
        if: steps.climatology.outcome != 'success'
        run: |
          echo 'Climatology build failed. Any safely completed annual state was committed for resume.'
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
