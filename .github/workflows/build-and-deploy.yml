name: Build climatology and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/build-and-deploy.yml'
  schedule:
    # Run after the prior year's final nClimGrid products have had time to settle.
    - cron: '17 9 15 3 *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Rebuild the complete 1951-present climatology from scratch'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lix-heavy-rain-climatology
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt

      - name: Build NOAA heavy-rain climatology
        id: climatology
        continue-on-error: true
        shell: bash
        run: |
          EXTRA=''
          if [[ '${{ inputs.rebuild }}' == 'true' ]]; then
            EXTRA='--rebuild'
          fi
          python scripts/build_climatology.py $EXTRA --workers 12

      - name: Build NOAA observation-support climatology
        id: observation_support
        if: steps.climatology.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          EXTRA=''
          if [[ '${{ inputs.rebuild }}' == 'true' ]]; then
            EXTRA='--rebuild'
          fi
          python scripts/build_observation_density.py $EXTRA --workers 12

      - name: Commit generated state and climatology
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          SNAPSHOT="$(mktemp -d)"
          mkdir -p "$SNAPSHOT/docs-data" "$SNAPSHOT/data"
          if [[ -d docs/data ]]; then
            cp -a docs/data/. "$SNAPSHOT/docs-data/"
          fi
          for state_file in data/climatology_state.npz data/observation_density_state.npz; do
            if [[ -f "$state_file" ]]; then
              cp "$state_file" "$SNAPSHOT/data/$(basename "$state_file")"
            fi
          done

          git fetch origin main
          git reset --hard origin/main

          rm -rf docs/data
          mkdir -p docs/data data
          if [[ -d "$SNAPSHOT/docs-data" ]]; then
            cp -a "$SNAPSHOT/docs-data/." docs/data/
          fi
          for state_file in climatology_state.npz observation_density_state.npz; do
            if [[ -f "$SNAPSHOT/data/$state_file" ]]; then
              cp "$SNAPSHOT/data/$state_file" "data/$state_file"
            fi
          done

          git add -A docs/data data/climatology_state.npz data/observation_density_state.npz 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Update heavy-rain climatology data'
            git push origin HEAD:main
          fi

      - name: Stop if climatology build failed
        if: steps.climatology.outcome != 'success'
        run: |
          echo 'Climatology build failed. Any safely completed annual state was committed for resume.'
          exit 1

      - name: Stop if observation-support build failed
        if: steps.observation_support.outcome != 'success'
        run: |
          echo 'Observation-support build failed. Any safely completed annual state was committed for resume.'
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
